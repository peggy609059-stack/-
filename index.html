<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧日照中心 - 實境模擬參訪系統</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
        body { margin: 0; font-family: "Microsoft JhengHei", sans-serif; }
        #panorama { width: 100vw; height: 100vh; }
        #title-overlay {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(0, 0, 0, 0.75); color: white; padding: 15px 20px; border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            max-width: 300px;
        }
        #title-overlay h2 { margin: 0 0 5px 0; font-size: 2.0rem; }
        #title-overlay p { margin: 0 0 10px 0; font-size: 1.5rem; color: #ccc; }
        
        /* 介紹彈跳視窗樣式 */
        #info-modal {
            position: absolute; bottom: 20px; left: 20px; z-index: 10;
            background: rgba(255, 255, 255, 0.95); color: #333; padding: 15px 20px; border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4); max-width: 320px; display: none;
            border-left: 5px solid #007bff;
        }
        #info-modal h3 { margin: 0 0 8px 0; font-size: 2.1rem; color: #007bff; }
        #info-modal p { margin: 0; font-size: 0.9rem; line-height: 1.8; color: #555; }
        #info-modal .close-btn {
            position: absolute; top: 8px; right: 10px; background: none; border: none;
            font-size: 1rem; cursor: pointer; color: #888;
        }
        #info-modal .close-btn:hover { color: #333; }
    </style>
</head>
<body>

    <div id="title-overlay">
        <h2>蘆洲集賢社區長照機構線上參訪系統</h2>
        <p>💡提示：點擊畫面中的場景按鈕(↑)可自由穿梭各個區域</p>
    </div>

    <!-- 空間介紹彈跳視窗 -->
    <div id="info-modal">
        <button class="close-btn" onclick="closeModal()">&times;</button>
        <h3 id="modal-title">區域名稱</h3>
        <p id="modal-desc">區域介紹內容...</p>
    </div>

    <div id="panorama"></div>

    <script>
        // 各區域的詳細介紹資料（已修正重複 key 與語法結構）
        const sceneInfo = {
            "counter": {
                "title": "櫃台",
                "desc": "歡迎來到蘆洲集賢社區長照機構，這裡是訪客接待與諮詢的櫃台區域。"
            },
            "shoes": {
                "title": "鞋櫃區",
                "desc": "進入館內前的鞋櫃區，請在此更換室內鞋。"
            },
            "locker": {
                "title": "個人置物櫃區",
                "desc": "提供長輩與訪客放置隨身物品的個人置物空間。"
            },
            "corridor": {
                "title": "走廊",
                "desc": "連接各個生活室與公共設施的走廊通道。"
            },
            "middle": {
                "title": "走廊（中段）",
                "desc": "走廊中段區域，通往上課區、快樂家以及洗手間。"
            },
            "safe_home": {
                "title": "平安家（日照生活室）",
                "desc": "提供長輩日常活動與照顧的溫馨生活空間——平安家。"
            },
            "happy": {
                "title": "快樂家（日照生活室）",
                "desc": "充滿歡笑與互動的日照生活空間——快樂家。"
            },
            "accessible_toilet": {
                "title": "無障礙廁所",
                "desc": "具備安全扶手與寬敞空間的無障礙浴廁設施。"
            },
            "toilet2": {
                "title": "洗手間（二）",
                "desc": "性別友善與無障礙兼具的洗手間。"
            },
            "toilet1": {
                "title": "洗手間（一）",
                "desc": "館內便利清潔的性別友善洗手間。"
            },
            "Attend class": {
                "title": "多功能上課區",
                "desc": "進行健康促進、手作課程與團體活動的多功能上課空間。"
            },
            "Perfect": {
                "title": "圓滿家（日照生活室）",
                "desc": "提供舒適環境的日照生活空間——圓滿家。"
            },
            "kitchen": {
                "title": "廚房",
                "desc": "為長輩準備營養餐食與點心的專屬廚房區域。"
            },
            "activity": {
                "title": "活動區",
                "desc": "多元休閒與體適能活動的寬敞空間。"
            }
        };

        const viewer = pannellum.viewer('panorama', {
            "default": {
                "firstScene": "counter",
                "author": "蘆洲集賢社區長照機構",
                "autoLoad": true,
                "compass": true
            },
            "scenes": {
                "counter": {
                    "title": "櫃台", "type": "equirectangular", "panorama": "櫃台.jpg",
                    "hotSpots": [{ "pitch": 0, "yaw": 120, "type": "scene", "text": "前往：鞋櫃", "sceneId": "shoes" }]
                },
                "shoes": {
                    "title": "鞋櫃", "type": "equirectangular", "panorama": "鞋櫃.jpg",
                    "hotSpots": [
                        { "pitch": 0, "yaw": 140, "type": "scene", "text": "返回：櫃台", "sceneId": "counter" },
                        { "pitch": 0, "yaw": 0, "type": "scene", "text": "前往：置物櫃", "sceneId": "locker" }
                    ]
                },
                "locker": {
                    "title": "置物櫃", "type": "equirectangular", "panorama": "櫃子.jpg",
                    "hotSpots": [
                        { "pitch": 0, "yaw": 90, "type": "scene", "text": "返回：鞋櫃", "sceneId": "shoes" },
                        { "pitch": 0, "yaw": -90, "type": "scene", "text": "前往：活動區", "sceneId": "activity" },
                        { "pitch": 0, "yaw": 180, "type": "scene", "text": "前往：走廊", "sceneId": "corridor" }
                    ]
                },
                "corridor": {
                    "title": "走廊", "type": "equirectangular", "panorama": "走廊.jpg",
                    "hotSpots": [
                        { "pitch": 0, "yaw": 128, "type": "scene", "text": "返回：置物櫃", "sceneId": "locker" },
                        { "pitch": 0, "yaw": 35, "type": "scene", "text": "前往：平安家", "sceneId": "safe_home" },
                        { "pitch": 0, "yaw": -50, "type": "scene", "text": "前往：中段", "sceneId": "middle" },
                        { "pitch": 0, "yaw": -130, "type": "scene", "text": "前往：無障礙廁所", "sceneId": "accessible_toilet" }
                    ]
                },
                "middle": {
                    "title": "走廊2", "type": "equirectangular", "panorama": "中段.jpg",
                    "hotSpots": [
                        { "pitch": 0, "yaw": -170, "type": "scene", "text": "前往：走廊", "sceneId": "corridor" },
                        { "pitch": 0, "yaw": -20, "type": "scene", "text": "前往：上課區", "sceneId": "Attend class" },
                        { "pitch": 0, "yaw": 90, "type": "scene", "text": "前往：快樂家", "sceneId": "happy" },
                        { "pitch": 0, "yaw": -130, "type": "scene", "text": "前往：性別友善廁所與無障礙廁所", "sceneId": "toilet2" },
                        { "pitch": 0, "yaw": -80, "type": "scene", "text": "前往：性別友善廁所", "sceneId": "toilet1" }
                    ]
                },
                "safe_home": {
                    "title": "平安家", "type": "equirectangular", "panorama": "平安家.jpg",
                    "hotSpots": [{ "pitch": 0, "yaw": 180, "type": "scene", "text": "返回：走廊", "sceneId": "corridor" }]
                },
                "happy": {
                    "title": "快樂家", "type": "equirectangular", "panorama": "快樂家.jpg",
                    "hotSpots": [{ "pitch": 0, "yaw": 180, "type": "scene", "text": "返回：走廊2", "sceneId": "middle" }]
                },
                "accessible_toilet": {
                    "title": "無障礙廁所", "type": "equirectangular", "panorama": "廁所4.jpg",
                    "hotSpots": [{ "pitch": 0, "yaw": 90, "type": "scene", "text": "返回：走廊", "sceneId": "corridor" }]
                },
                "toilet2": {
                    "title": "性別友善廁所與無障礙廁所", "type": "equirectangular", "panorama": "廁所2.jpg",
                    "hotSpots": [{ "pitch": 0, "yaw": 180, "type": "scene", "text": "返回：走廊2", "sceneId": "middle" }]
                },
                "toilet1": {
                    "title": "性別友善廁所", "type": "equirectangular", "panorama": "廁所2.jpg",
                    "hotSpots": [{ "pitch": 0, "yaw": 180, "type": "scene", "text": "返回：走廊2", "sceneId": "middle" }]
                },
                "Perfect": {
                    "title": "圓滿家", "type": "equirectangular", "panorama": "圓滿家.jpg",
                    "hotSpots": [{ "pitch": 0, "yaw": 180, "type": "scene", "text": "返回：上課區", "sceneId": "Attend class" }]
                },
                "kitchen": {
                    "title": "廚房", "type": "equirectangular", "panorama": "廚房.jpg", /* 請確認您的圖片檔名 */
                    "hotSpots": [{ "pitch": 0, "yaw": 180, "type": "scene", "text": "返回：上課區", "sceneId": "Attend class" }]
                },
                "Attend class": {
                    "title": "上課區", "type": "equirectangular", "panorama": "上課區.jpg",
                    "hotSpots": [
                        { "pitch": 0, "yaw": -150, "type": "scene", "text": "返回：走廊2", "sceneId": "middle" },
                        { "pitch": 0, "yaw": 80, "type": "scene", "text": "前往：圓滿家", "sceneId": "Perfect" },
                        { "pitch": 0, "yaw": -50, "type": "scene", "text": "前往：廚房", "sceneId": "kitchen" }, /* 已修正 sceneId */
                        { "pitch": 0, "yaw": -110, "type": "scene", "text": "前往：性別友善廁所", "sceneId": "toilet1" }
                    ]
                },
                "activity": {
                    "title": "活動區", "type": "equirectangular", "panorama": "活動區.jpg",
                    "hotSpots": [{ "pitch": 0, "yaw": -170, "type": "scene", "text": "返回：置物櫃", "sceneId": "locker" }]
                }
            }
        });

        // 監聽場景切換事件，自動顯示對應的空間介紹
        viewer.on('scenechange', function(sceneId) {
            showInfo(sceneId);
        });

        // 顯示介紹視窗的函式
        function showInfo(sceneId) {
            const info = sceneInfo[sceneId];
            if (info) {
                document.getElementById('modal-title').innerText = info.title;
                document.getElementById('modal-desc').innerText = info.desc;
                document.getElementById('info-modal').style.display = 'block';
            }
        }

        // 關閉介紹視窗的函式
        function closeModal() {
            document.getElementById('info-modal').style.display = 'none';
        }

        // 初始化載入時顯示預設場景（櫃台）的介紹
        window.onload = function() {
            showInfo("counter");
        };
    </script>

</body>
</html>
