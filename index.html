<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日照中心導覽地圖</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .map-container {
            position: relative;
            display: inline-block;
            max-width: 800px;
            width: 100%;
        }
        .map-container img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        /* 紅點標記樣式 */
        .map-pin {
            position: absolute;
            width: 16px;
            height: 16px;
            background-color: #ff4757;
            border: 2px solid #ffffff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 6px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .map-pin:hover {
            transform: translate(-50%, -50%) scale(1.3);
            background-color: #ff6b81;
        }
        .controls {
            margin-top: 20px;
        }
        button {
            padding: 10px 15px;
            margin: 5px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h2>日照中心環境導覽</h2>
    
    <!-- 地圖與紅點容器 -->
    <div class="map-container" id="mapContainer">
        <!-- 請將 src 替換為您的平面圖檔案路徑 -->
        <img src="日照中心平面圖.jpg" alt="日照中心平面圖">
        <!-- 動態生成的紅點會放在這裡 -->
        <div id="currentPin" class="map-pin" style="display: none;"></div>
    </div>

    <!-- 區域切換按鈕區 -->
    <div class="controls" id="controls">
        <!-- 按鈕將透過 JavaScript 自動生成 -->
    </div>

    <script>
        // 設定各個 sceneId 在平面圖上的相對位置百分比 (對應 0~100% 座標)
        const sceneCoordinates = {
            "counter": { x: 14, y: 92, name: "櫃檯" },           // 櫃檯 (左下角)
            "shoes": { x: 14, y: 76, name: "鞋櫃區" },             // 鞋櫃區
            "aisle": { x: 20, y: 58, name: "走道" },             // 走道
            "locker": { x: 23, y: 50, name: "置物櫃" },            // 置物櫃
            "corridor": { x: 38, y: 50, name: "走廊" },          // 走廊
            "middle": { x: 55, y: 50, name: "中段走廊" },            // 走廊2 / 中段
            "safe_home": { x: 38, y: 25, name: "平安家" },         // 平安家
            "happy": { x: 55, y: 28, name: "快樂家" },             // 快樂家
            "Perfect": { x: 73, y: 28, name: "圓滿家" },           // 圓滿家
            "Attend class": { x: 73, y: 58, name: "上課區" },      // 上課區
            "activity": { x: 20, y: 22, name: "活動區" },          // 活動區 (左上角)
            "accessible_toilet": { x: 37, y: 64, name: "無障礙廁所" }, // 無障礙廁所 (中段上方)
            "toilet1": { x: 59, y: 88, name: "性別友善廁所 (右)" },   // 性別友善廁所 (下方靠右)
            "toilet2": { x: 49, y: 88, name: "性別友善廁所 (左)" },   // 性別友善廁所與無障礙廁所 (下方靠左)
            "kitchen": { x: 80, y: 88, name: "廚房區" },           // 廚房區 (右下角)
            "escape_wash": { x: 85, y: 25, name: "逃生區" }        // 逃生區 (右上角)
        };

        const pin = document.getElementById('currentPin');
        const controlsContainer = document.getElementById('controls');

        // 切換到指定場景並移動紅點
        function moveToScene(sceneId) {
            const coord = sceneCoordinates[sceneId];
            if (coord) {
                pin.style.left = coord.x + '%';
                pin.style.top = coord.y + '%';
                pin.style.display = 'block';
                console.log(`已切換至：${coord.name} (${coord.x}%, ${coord.y}%)`);
            }
        }

        // 動態生成控制按鈕
        function initControls() {
            for (const [sceneId, data] of Object.entries(sceneCoordinates)) {
                const btn = document.createElement('button');
                btn.innerText = data.name;
                btn.onclick = () => moveToScene(sceneId);
                controlsContainer.appendChild(btn);
            }
        }

        // 頁面載入後初始化按鈕，並預設顯示第一個點（櫃檯）
        window.onload = () => {
            initControls();
            moveToScene('counter');
        };
    </script>
</body>
</html>
