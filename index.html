<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蘆洲集賢社區長照機構線上參訪系統</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
        body { margin: 0; font-family: "Microsoft JhengHei", sans-serif; overflow: hidden; background: #000; font-size: calc(1rem + 5px); }
        #panorama { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }

        /* 教學模式橫幅樣式 */
        #tutorial-banner {
            position: absolute; top: 100px; left: 50%; transform: translateX(-50%);
            z-index: 100; background: rgba(0, 0, 0, 0.88); color: white;
            padding: 18px 28px; border-radius: 12px; max-width: 650px; width: 90%;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6); border: 2px solid #007bff;
            display: none; text-align: center; box-sizing: border-box;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -10px); } to { opacity: 1; transform: translate(-50%, 0); } }
        #tutorial-title { font-size: calc(1.3rem + 5px); color: #4dabf7; margin-bottom: 8px; font-weight: bold; }
        #tutorial-desc { font-size: calc(1.1rem + 3px); line-height: 1.5; margin-bottom: 15px; }
        .tutorial-btn-group { display: flex; justify-content: center; gap: 12px; }
        .tutorial-btn {
            background: #007bff; color: white; border: none; padding: 8px 18px;
            font-size: calc(1rem + 2px); border-radius: 6px; cursor: pointer; font-weight: bold;
            transition: background 0.2s;
        }
        .tutorial-btn:hover { background: #0056b3; }
        .tutorial-btn.secondary { background: #6c757d; }
        .tutorial-btn.secondary:hover { background: #5a6268; }

        /* 環視滑動提示指引圖示 */
        #drag-guide-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 90; pointer-events: none; display: none; flex-direction: column;
            align-items: center; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .drag-icon-circle {
            width: 80px; height: 80px; border: 4px dashed rgba(255,255,255,0.8);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 2rem; animation: rotateRing 3s linear infinite;
        }
        @keyframes rotateRing { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 平面圖片檢視器容器樣式：垂直置中排列 */
        #flat-view-container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.92); z-index: 20; display: none;
            justify-content: center; align-items: center; flex-direction: column;
            padding: 20px; box-sizing: border-box;
        }
        #flat-view-container img {
            max-width: 80vw; max-height: 55vh; border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); object-fit: contain;
            border: 2px solid rgba(255,255,255,0.2);
            margin-bottom: 15px;
        }
        #flat-detail-panel {
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 15px 25px;
            border-radius: 8px;
            max-width: 75vw;
            width: 700px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border-left: 5px solid #007bff;
            box-sizing: border-box;
            position: relative;
        }
        #flat-detail-panel h3 { margin: 0 0 8px 0; font-size: calc(1.7rem + 10px); color: #007bff; }
        #flat-detail-panel p { margin: 0; font-size: calc(1.6rem + 10px); line-height: 1.5; color: #555; }
        
        #flat-detail-panel.keep-original-size h3 { font-size: 1.7rem; }
        #flat-detail-panel.keep-original-size p { font-size: 1.6rem; }

        .back-to-class-btn {
            background: #dc3545; color: white; border: none; padding: 10px 18px;
            font-size: calc(1.2rem + 5px); border-radius: 6px; cursor: pointer; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4); transition: background 0.2s;
            margin-top: 15px;
            display: inline-block;
        }
        .back-to-class-btn:hover { background: #c82333; }

        /* 空間介紹區域（右下角） */
        #info-modal {
            position: absolute; bottom: 20px; right: 20px; z-index: 30;
            background: rgba(255, 255, 255, 0.95); color: #333; padding: 15px 20px; border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4); max-width: 390px; width: 390px;
            border-left: 5px solid #007bff;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        #info-modal h3 { margin: 0 0 8px 0; font-size: calc(1.7rem + 10px); color: #007bff; }
        #info-modal p { margin: 0; font-size: calc(1.2rem + 10px); line-height: 1.6; color: #555; }

        #info-modal .close-btn {
            font-size: calc(1.3rem + 10px);
            padding: 8px 14px;
            cursor: pointer;
            background: #f8f9fa;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 10px;
            font-weight: bold;
            color: #333;
        }
        #info-modal .close-btn:hover { background: #e2e6ea; }

        #info-modal.keep-original-size h3 { font-size: 1.7rem; }
        #info-modal.keep-original-size p { font-size: 1.2rem; }

        #info-modal.collapsed {
            padding: 10px 5px;
            cursor: pointer;
            background: rgba(0, 123, 255, 0.9);
            border-left: none;
            bottom: 20px;
            right: 20px;
            width: 183px !important;
            max-width: 183px !important;
            text-align: center;
        }
        #info-modal.collapsed h3,
        #info-modal.collapsed p,
        #info-modal.collapsed .close-btn {
            display: none;
        }
        #info-modal.collapsed::after {
            content: "展開空間介紹";
            font-size: calc(1.3rem + 10px);
            color: #fff;
            font-weight: bold;
            white-space: nowrap;
        }

        /* 右上角頂部按鈕列容器（包含「回到上一步」與「快速導覽」） */
        #top-right-controls {
            position: absolute; top: 20px; right: 20px; z-index: 25;
            display: flex; gap: 12px; align-items: center;
            transition: opacity 0.3s ease;
        }

        /* 回到上一步按鈕樣式 */
        .back-step-btn {
            width: 185px;
            height: 62px;
            padding: 12px 18px;
            font-size: calc(1.3rem + 10px);
            border-radius: 6px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            box-sizing: border-box;
            text-align: center;
            line-height: normal;
            background: #6c757d; color: white; border: none; cursor: pointer;
            transition: background 0.2s, opacity 0.3s ease;
        }
        .back-step-btn:hover { background: #5a6268; }

        /* 快速導覽選單樣式 */
        #quick-nav-select {
            width: 185px;
            height: 62px;    
            padding: 12px 18px;
            font-size: calc(1.3rem + 10px);
            border-radius: 6px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            box-sizing: border-box;
            text-align: center;
            line-height: normal;
            background: rgba(0, 123, 255, 0.9); color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            cursor: pointer; outline: none;
        }
        #quick-nav-select option { background: #333; color: white; }

        /* 左下角小地圖樣式 */
        #mini-map-container {
            position: absolute; bottom: 39px; left: 20px; z-index: 25;
            width: 180px; height: 120px; background: rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 8px;
            overflow: hidden; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
        }
        #mini-map-container:hover {
            border-color: #007bff;
            transform: scale(1.05);
        }
        #mini-map-img {
            width: 100%; height: 100%; object-fit: cover;
            pointer-events: none;
        }
        
        .map-zoom-icon {
            position: absolute; top: 8px; right: 8px; z-index: 27;
            background: rgba(0, 0, 0, 0.6); color: white;
            width: 26px; height: 26px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: calc(0.9rem + 5px); pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .map-marker {
            position: absolute; width: 14px; height: 14px; background: #dc3545;
            border: 2px solid #fff; border-radius: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 6px rgba(0,0,0,0.8); transition: all 0.3s ease;
            z-index: 26; pointer-events: none;
        }

        /* 放大版地圖 Modal 樣式 */
        #map-modal {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85); z-index: 50; display: none;
            justify-content: center; align-items: center; flex-direction: column;
        }
        #map-modal-content {
            position: relative; max-width: 80vw; max-height: 80vh;
            background: #fff; padding: 15px; border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        #map-modal-img {
            max-width: 75vw; max-height: 70vh; display: block; border-radius: 4px;
        }
        #map-modal-img-wrapper {
            position: relative;
            display: inline-block;
        }
        .close-map-btn {
            position: absolute; top: -15px; right: -15px; background: #dc3545;
            color: white; border: none; width: 35px; height: 35px; border-radius: 50%;
            font-size: calc(1.2rem + 5px); cursor: pointer; font-weight: bold; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            z-index: 60;
        }

        .pnlm-hotspot-base {
            transform: scale(4);
            transform-origin: center center;
        }

        .pnlm-tooltip span {
            font-size: calc(1.1rem + 5px) !important;
            padding: 6px 12px !important;
        }
    </style>
</head>
<body>

    <!-- 教學模式橫幅 -->
    <div id="tutorial-banner">
        <div id="tutorial-title">導覽教學步驟4：前往下一個地區</div>
        <div id="tutorial-desc">載入中...</div>
        <div class="tutorial-btn-group" id="tutorial-btn-group">
            <button class="tutorial-btn" id="tutorial-next-btn" onclick="nextTutorialStep()">下一步</button>
        </div>
    </div>

    <!-- 步驟 3 專用環狀滑動提示指引圖示 -->
    <div id="drag-guide-overlay">
        <div class="drag-icon-circle">↔️</div>
        <p style="margin-top: 10px; font-weight: bold;">請按住畫面左右滑動</p>
    </div>

    <!-- 右上角控制區：「回到上一步」在「快速導覽」左邊 -->
    <div id="top-right-controls">
        <button class="back-step-btn" onclick="goBackStep()">回到上一步</button>
        <select id="quick-nav-select" onchange="quickJump(this.value)">
            <option value="" disabled selected>快速導覽</option>
            <option value="counter">櫃檯</option>
            <option value="shoes">鞋櫃</option>
            <option value="locker">櫃子</option>
            <option value="activity">活動區</option>
            <option value="safe_home">平安家</option>
            <option value="happy">快樂家</option>
            <option value="Perfect">圓滿家</option>
            <option value="Attend class">教室區</option>
            <option value="openKitchen">廚房</option>
            <option value="openEscape">逃生區與洗手台</option>
            <option value="accessible_toilet">無障礙廁所</option>
            <option value="toilet1">性別友善廁所</option>
            <option value="toilet2">性別友善廁所與無障礙廁所</option>
        </select>
    </div>

    <!-- 左下角小地圖 -->
    <div id="mini-map-container" onclick="openLargeMap()" title="點擊放大全圖">
        <div class="map-zoom-icon">🔍</div>
        <img id="mini-map-img" src="1791951164235.jpg" alt="小地圖" onerror="this.src='https://placehold.co/180x120/333/fff?text=Map'">
        <div id="map-marker" class="map-marker"></div>
    </div>

    <!-- 放大版地圖 Modal -->
    <div id="map-modal" onclick="closeLargeMap(event)">
        <div id="map-modal-content" onclick="event.stopPropagation()">
            <button class="close-map-btn" onclick="closeLargeMap()">✖</button>
            <h3 style="margin-top: 0; color: #333; text-align: center; font-size: calc(1.4rem + 5px);">中心平面導覽圖</h3>
            <div id="map-modal-img-wrapper">
                <img id="map-modal-img" src="1791951164235.jpg" alt="大張地圖" onerror="this.src='https://placehold.co/800x600/333/fff?text=Large+Map'">
                <div id="map-modal-marker" class="map-marker"></div>
            </div>
        </div>
    </div>

    <!-- 空間介紹彈跳視窗 -->
    <div id="info-modal" onclick="checkInfoToggle(event)">
        <button class="close-btn" onclick="toggleInfoModal(event)">✖ 關閉介紹</button>
        <h3 id="modal-title">區域名稱</h3>
        <p id="modal-desc">區域介紹內容...</p>
    </div>

    <div id="panorama"></div>

    <!-- 平面照片檢視容器 -->
    <div id="flat-view-container">
        <img id="flat-image" src="廚房.jpg" alt="平面圖" onerror="this.src='https://placehold.co/800x600/333/fff?text=Flat+Image'">

        <div id="flat-detail-panel">
            <h3 id="flat-detail-title">區域名稱</h3>
            <p id="flat-detail-desc">詳細介紹內容...</p>
            <button class="back-to-class-btn" onclick="returnToClass()">返回教室區</button>
        </div>
    </div>

    <script>
        const sceneInfo = {
            "counter": {
                "title": "櫃檯｜長輩接送區",
                "desc": "提供家屬及交通車接送長輩的交接空間，方便長輩每日安全進出中心。"
            },
            "shoes": {
                "title": "鞋櫃區｜培養生活自主性",

            },
            "locker": {
                "title": "置物櫃｜一人一櫃",
                "desc": "每位長輩都有自己的專屬置物櫃，可放置個人物品，保有自己的小空間。"
            },
            "safe_home": {
                "title": "平安家（日照生活室）",
                "desc": "提供午休與日常休息空間，設有固定座位。"
            },
            "happy": {
                "title": "快樂家（日照生活室）",

                "desc": "設有三個小便斗、三間廁所及衛生紙取用區，外側左方設有洗手台。每間皆設有求救鈴。"
            },
            "toilet2": {
                "title": "性別友善廁所與無障礙廁所",

            },
            "Attend class": {

                "keepOriginal": true
            },
            "escape_wash": {
                "title": "逃生區與洗手台｜安全疏散與衛生便利",
                "desc": "位於教室區右側，設置緊急逃生動線以確保突發狀況時的安全疏散；同時配有洗手台，方便長輩在活動前後或用餐前後就近洗手維持衛生。",
                "keepOriginal": true
            },
            "activity": {
                "title": "活動區｜休息與交流",
                "desc": "設有沙發椅，提供午休及活動空檔休息使用，並有固定座位，讓長輩擁有熟悉的位置。"
            }
        };

        const sceneCoordinates = {
            "counter": { x: 86, y: 90 },
            "shoes": { x: 86, y: 70 },
            "locker": { x: 80, y: 58.5 },
            "safe_home": { x: 65, y: 30 },
            "happy": { x: 47.1, y: 30 },
            "Perfect": { x: 30, y: 30 },
            "Attend class": { x: 30, y: 64 },
            "activity": { x: 83, y: 30 },
            "accessible_toilet": { x: 60, y: 68 },
            "toilet1": { x: 40, y: 85 },
            "toilet2": { x: 57, y: 85 },
            "kitchen": { x: 22, y: 90 },
            "escape_wash": { x: 18, y: 30 }

        const viewer = pannellum.viewer('panorama', {
            "default": {
                "firstScene": "counter",
                "autoLoad": true,
                "compass": false
            },
            "scenes": {
                "counter": {
                    "title": "櫃台", "type": "equirectangular", "panorama": "櫃台.jpg",
                    "hotSpots": [{ "pitch": 0, "yaw": 120, "type": "scene", "text": "前往：鞋櫃", "sceneId": "shoes" }]

                "shoes": {

                        { "pitch": 0, "yaw": -90, "type": "scene", "text": "前往：活動區", "sceneId": "activity" },
                        { "pitch": 0, "yaw": 145, "type": "scene", "text": "前往：無障礙廁所", "sceneId": "accessible_toilet" },
                        { "pitch": 0, "yaw": 170, "type": "scene", "text": "前往：走廊", "sceneId": "corridor" }
                    ]
                },
                "corridor": {
                    "title": "走廊", "type": "equirectangular", "panorama": "走廊.jpg",
                    "hotSpots": [
                        { "pitch": 0, "yaw": 150, "type": "scene", "text": "返回：置物櫃", "sceneId": "locker" },
                        { "pitch": 0, "yaw": 35, "type": "scene", "text": "前往：平安家", "sceneId": "safe_home" },
                        { "pitch": 0, "yaw": 3, "type": "scene", "text": "前往：快樂家", "sceneId": "happy" },
                        { "pitch": 0, "yaw": -50, "type": "scene", "text": "前往：中段", "sceneId": "middle" },
                        { "pitch": 0, "yaw": -130, "type": "scene", "text": "前往：無障礙廁所", "sceneId": "accessible_toilet" }
                    ]
                },
                "middle": {
                    "title": "走廊2", "type": "equirectangular", "panorama": "中段.jpg",
                    "hotSpots": [
                        { "pitch": 0, "yaw": 155, "type": "scene", "text": "返回：走廊", "sceneId": "corridor" },
                        { "pitch": 0, "yaw": -20, "type": "scene", "text": "前往：上課區", "sceneId": "Attend class" },
                        { "pitch": 0, "yaw": 100, "type": "scene", "text": "前往：快樂家", "sceneId": "happy" },
                        { "pitch": 0, "yaw": -130, "type": "scene", "text": "前往：性別友善廁所與無障礙廁所", "sceneId": "toilet2" },
                        { "pitch": 0, "yaw": -85, "type": "scene", "text": "前往：性別友善廁所", "sceneId": "toilet1" }
                    ]
                },
                "safe_home": {
                    "title": "平安家", "type": "equirectangular", "panorama": "平安家.jpg",
                    "hotSpots": [{ "pitch": 0, "yaw": 180, "type": "scene", "text": "返回：走廊", "sceneId": "corridor" }]
                },
                "happy": {
                    "title": "快樂家", "type": "equirectangular", "panorama": "快樂家.jpg",
                    "hotSpots": [{ "pitch": 0, "yaw": 170, "type": "scene", "text": "返回：走廊2", "sceneId": "middle" }]
                },
                "accessible_toilet": {
                    "title": "無障礙廁所", "type": "equirectangular", "panorama": "廁所4.jpg",
                    "hotSpots": [{ "pitch": 0, "yaw": 130, "type": "scene", "text": "返回：走廊", "sceneId": "corridor" }]
                },
                "toilet2": {
                    "title": "性別友善廁所與無障礙廁所", "type": "equirectangular", "panorama": "廁所2.jpg",
                    "hotSpots": [{ "pitch": 0, "yaw": 70, "type": "scene", "text": "返回：走廊2", "sceneId": "middle" }]
                },
                "toilet1": {
                    "title": "性別友善廁所", "type": "equirectangular", "panorama": "廁所1.jpg",
                    "hotSpots": [{ "pitch": 0, "yaw": 80, "type": "scene", "text": "返回：走廊2", "sceneId": "middle" }]
                },
                "Perfect": {
                    "title": "圓滿家", "type": "equirectangular", "panorama": "圓滿家.jpg",
                    "hotSpots": [{ "pitch": 0, "yaw": -135, "type": "scene", "text": "返回：上課區", "sceneId": "Attend class" }]
                },
                "Attend class": {
                   "title": "上課區", "type": "equirectangular", "panorama": "上課區.jpg",
                    "hotSpots": [
                        { "pitch": 0, "yaw": -135, "type": "scene", "text": "前往：性別友善廁所與無障礙廁所", "sceneId": "toilet2" },
                        { "pitch": 0, "yaw": -160, "type": "scene", "text": "返回：走廊2", "sceneId": "middle" },
                        { "pitch": 0, "yaw": 119, "type": "scene", "text": "前往：圓滿家", "sceneId": "Perfect" },
                        { "pitch": 0, "yaw": -115, "type": "scene", "text": "前往：性別友善廁所", "sceneId": "toilet1" },
                        { "pitch": -5, "yaw": -45, "type": "info", "text": "檢視：廚房區平面圖", "clickHandlerFunc": openKitchenFlatView },
                        { "pitch": -5, "yaw": 100, "type": "info", "text": "檢視：逃生區與洗手台", "clickHandlerFunc": openEscapeWashFlatView }
                    ]
                },
                "activity": {
                    "title": "活動區", "type": "equirectangular", "panorama": "活動區.jpg",
                    "hotSpots": [{ "pitch": 0, "yaw": -170, "type": "scene", "text": "返回：置物櫃", "sceneId": "locker" }]
                }
            }
        });

        // ================= 教學模式核心邏輯 =================
        let currentTutorialStep = 4; // 直接從步驟 4 開始
        let dragDistanceSum = 0;
        let isMouseDownOnViewer = false;
        let lastMouseX = 0;

        const tutorialSteps = {
            1: {
                title: "導覽教學步驟1：查看空間介紹",
                desc: "如何查看空間介紹。右下角隨時提供當前區域的詳細介紹。請點擊右下角的『展開空間介紹』！",
                showNextBtn: false
            },
            2: {
                title: "導覽教學步驟2：關閉空間介紹",
                desc: "如何關閉空間介紹。左上角隨時可以關閉空間介紹。請點擊『關閉介紹』將其收合！",
                showNextBtn: false
            },
            3: {
                title: "導覽教學步驟3：環視周遭環境",
                desc: "如何環視周遭環境。請按住畫面左右滑動，進行 360 度旋轉觀察！",
                showNextBtn: false,
                onEnter: () => { document.getElementById('drag-guide-overlay').style.display = 'flex'; }
            },
            4: {
                title: "導覽教學步驟4：前往下一個地區",
                desc: "如何前往下一個地區。請點擊畫面中的箭頭引導按鈕前往下個地點！",
                showNextBtn: false,
                onEnter: () => { document.getElementById('drag-guide-overlay').style.display = 'none'; }
            },
            5: {
                title: "導覽教學步驟5：使用快速導覽",
                desc: "如何使用快速導覽。請點擊右上角的『快速導覽』選單，並點選其中一個地點。",
                showNextBtn: false
            },
            6: {
                title: "導覽教學步驟6：使用地圖定位",
                desc: "如何使用地圖定位。請點擊左下角的小地圖將其放大！地圖點開後可以放大檢視",
                showNextBtn: false
            },
            7: {
                title: "導覽教學步驟7：關閉地圖定位",
                desc: "如何關閉地圖定位。請點擊地圖右上角的✖",
                showNextBtn: false
            },
            8: {
                title: "導覽教學步驟8：回到上一步",
                desc: "如何回到上一步。請點擊右上角的『回到上一步』按鈕！",
                showNextBtn: false
            },
            9: {
                title: "導覽教學步驟9：是否重新教學",
                desc: "是否要再教學一次？您可以點擊下方按鈕選擇是否重新進行導覽教學。",
                showNextBtn: false,
                customButtons: true
            },
            10: {
                title: "導覽教學步驟10：教學完成",
                desc: "🎉 教學完成！即將帶您回到初始畫面開始正式參訪...",
                showNextBtn: false
            }
        };

        function startTutorial() {
            currentTutorialStep = 4; // 固定從步驟 4 開始
            renderTutorialStep();
            document.getElementById('tutorial-banner').style.display = 'block';
        }

        function renderTutorialStep() {
            const stepData = tutorialSteps[currentTutorialStep];
            if (!stepData) return;

            document.getElementById('tutorial-title').innerText = stepData.title;
            document.getElementById('tutorial-desc').innerHTML = stepData.desc;

            const btnGroup = document.getElementById('tutorial-btn-group');
            if (stepData.customButtons) {
                btnGroup.innerHTML = `
                    <button class="tutorial-btn" onclick="restartTutorialYes()">是，重新教學</button>
                    <button class="tutorial-btn secondary" onclick="restartTutorialNo()">否，開始參訪</button>
                `;
            } else if (stepData.showNextBtn) {
                btnGroup.innerHTML = `<button class="tutorial-btn" onclick="nextTutorialStep()">下一步</button>`;
            } else {
                btnGroup.innerHTML = `<span style="font-size:0.95rem; color:#adb5bd; font-style:italic;">(請依上方指示操作畫面來進行下一步)</span>`;
            }

            if (stepData.onEnter) {
                stepData.onEnter();
            }
        }

        function nextTutorialStep() {
            if (currentTutorialStep < 10) {
                currentTutorialStep++;
                renderTutorialStep();
            } else {
                finishTutorial();
            }
        }

        function restartTutorialYes() {
            viewer.loadScene("counter");
            currentTutorialStep = 1;
            renderTutorialStep();
        }

        function restartTutorialNo() {
            document.getElementById('tutorial-banner').style.display = 'none';
            viewer.loadScene("counter");
        }

        function finishTutorial() {
            renderTutorialStep();
            setTimeout(() => {
                document.getElementById('tutorial-banner').style.display = 'none';
                viewer.loadScene("counter");
            }, 2500);
        }

        // ================= 原有功能函數 =================
        let navigationHistory = ["counter"];

        function openKitchenFlatView(event) {
            const container = document.getElementById('flat-view-container');
            document.getElementById('flat-image').src = "廚房.jpg";
            container.style.display = 'flex';

            document.getElementById('top-right-controls').style.opacity = '0';
            document.getElementById('top-right-controls').style.pointerEvents = 'none';
            document.getElementById('mini-map-container').style.opacity = '0';
            document.getElementById('mini-map-container').style.pointerEvents = 'none';
            document.getElementById('info-modal').style.opacity = '0';
            document.getElementById('info-modal').style.pointerEvents = 'none';

            const info = sceneInfo["kitchen"];
            const panel = document.getElementById('flat-detail-panel');
            if(info) {
                document.getElementById('flat-detail-title').innerText = info.title;
                document.getElementById('flat-detail-desc').innerHTML = info.desc;
                if (info.keepOriginal) {
                    panel.classList.add('keep-original-size');
                } else {
                    panel.classList.remove('keep-original-size');
                }
            }
        }

        function openEscapeWashFlatView(event) {
            const container = document.getElementById('flat-view-container');
            document.getElementById('flat-image').src = "逃生.jpg";
            container.style.display = 'flex';

            document.getElementById('top-right-controls').style.opacity = '0';
            document.getElementById('top-right-controls').style.pointerEvents = 'none';
            document.getElementById('mini-map-container').style.opacity = '0';
            document.getElementById('mini-map-container').style.pointerEvents = 'none';
            document.getElementById('info-modal').style.opacity = '0';
            document.getElementById('info-modal').style.pointerEvents = 'none';

            const info = sceneInfo["escape_wash"];
            const panel = document.getElementById('flat-detail-panel');
            if(info) {
                document.getElementById('flat-detail-title').innerText = info.title;
                document.getElementById('flat-detail-desc').innerHTML = info.desc;
                if (info.keepOriginal) {
                    panel.classList.add('keep-original-size');
                } else {
                    panel.classList.remove('keep-original-size');
                }
            }
        }

        function closeFlatView() {
            const container = document.getElementById('flat-view-container');
            container.style.display = 'none';

            document.getElementById('top-right-controls').style.opacity = '1';
            document.getElementById('top-right-controls').style.pointerEvents = 'auto';
            document.getElementById('mini-map-container').style.opacity = '1';
            document.getElementById('mini-map-container').style.pointerEvents = 'auto';
            document.getElementById('info-modal').style.opacity = '1';
            document.getElementById('info-modal').style.pointerEvents = 'auto';
        }

        function returnToClass() {
            closeFlatView();
            viewer.loadScene("Attend class");
        }

        document.getElementById('flat-view-container').addEventListener('click', function(e) {
            if (e.target === this) {
                closeFlatView();
            }
        });

        function goBackStep() {
            if (currentTutorialStep === 8) {
                nextTutorialStep(); // 步驟 8 完成
            }
            if (navigationHistory.length > 1) {
                navigationHistory.pop();
                const prevScene = navigationHistory[navigationHistory.length - 1];
                viewer.loadScene(prevScene);
            } else {
                alert("已經是起點囉！");
            }
        }

        function quickJump(value) {
            if (!value) return;

            if (currentTutorialStep === 5) {
                nextTutorialStep(); // 步驟 5 完成
            }

            if (value === "openKitchen") {
                viewer.loadScene("Attend class");
                setTimeout(openKitchenFlatView, 300);
            } else if (value === "openEscape") {
                viewer.loadScene("Attend class");
                setTimeout(openEscapeWashFlatView, 300);
            } else {
                viewer.loadScene(value);
            }

            document.getElementById('quick-nav-select').selectedIndex = 0;
        }

        function updateMapMarker(sceneId) {
            const pos = sceneCoordinates[sceneId];
            const miniMarker = document.getElementById('map-marker');
            const largeMarker = document.getElementById('map-modal-marker');
            
            if (pos) {
                miniMarker.style.left = pos.x + '%';
                miniMarker.style.top = pos.y + '%';
                miniMarker.style.display = 'block';

                largeMarker.style.left = pos.x + '%';
                largeMarker.style.top = pos.y + '%';
                largeMarker.style.display = 'block';
            } else {
                miniMarker.style.display = 'none';
                largeMarker.style.display = 'none';
            }
        }

        function openLargeMap() {
            if (currentTutorialStep === 6) {
                nextTutorialStep(); // 步驟 6 完成
            }
            document.getElementById('map-modal').style.display = 'flex';
        }

        function closeLargeMap(event) {
            if (!event || event.target.id === 'map-modal' || event.target.classList.contains('close-map-btn')) {
                if (currentTutorialStep === 7) {
                    nextTutorialStep(); // 步驟 7 完成
                }
                document.getElementById('map-modal').style.display = 'none';
            }
        }

        let currentSceneId = "counter";

        function toggleInfoModal(event) {
            if (event) event.stopPropagation();
            const modal = document.getElementById('info-modal');
            modal.classList.toggle('collapsed');
            
            if (modal.classList.contains('collapsed') && currentTutorialStep === 2) {
                nextTutorialStep(); // 步驟 2 完成
            }
        }

        function checkInfoToggle(event) {
            const modal = document.getElementById('info-modal');
            if (modal.classList.contains('collapsed')) {
                modal.classList.remove('collapsed');
                if (currentTutorialStep === 1) {
                    nextTutorialStep(); // 步驟 1 完成
                }
            }
        }

        viewer.on('scenechange', function(sceneId) {
            currentSceneId = sceneId;
            updateMapMarker(sceneId);
            
            if (navigationHistory[navigationHistory.length - 1] !== sceneId) {
                navigationHistory.push(sceneId);
            }

            if (currentTutorialStep === 4 && sceneId === "shoes") {
                nextTutorialStep(); // 步驟 4 完成
            }

            const info = sceneInfo[sceneId];
            const modal = document.getElementById('info-modal');
            if (info) {
                document.getElementById('modal-title').innerText = info.title;
                document.getElementById('modal-desc').innerText = info.desc;
                if (info.keepOriginal) {
                    modal.classList.add('keep-original-size');
                } else {
                    modal.classList.remove('keep-original-size');
                }
            }
        });

        function showInfo(sceneId) {
            const info = sceneInfo[sceneId];
            const modal = document.getElementById('info-modal');
            if (info) {
                document.getElementById('modal-title').innerText = info.title;
                document.getElementById('modal-desc').innerText = info.desc;
                if (info.keepOriginal) {
                    modal.classList.add('keep-original-size');
                } else {
                    modal.classList.remove('keep-original-size');
                }
            }
        }

        window.onload = function() {
            showInfo("counter");
            updateMapMarker("counter");
            document.getElementById('info-modal').classList.add('collapsed');
            
            // 啟動教學模式（預設直接從步驟 4 開始）
            startTutorial();
        };
    </script>
