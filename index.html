<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">

    <title>蘆洲集賢社區長照機構線上參訪系統</title>

    <style>
        body { margin: 0; font-family: "Microsoft JhengHei", sans-serif; overflow: hidden; background: #000; font-size: calc(1rem + 5px); }
        #panorama { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }

        /* 教學模式橫幅樣式 */
        #tutorial-banner {
            position: absolute; top: 90px; left: 50%; transform: translateX(-50%);
            z-index: 100; background: rgba(0, 0, 0, 0.92); color: white;
            padding: 22px 32px; border-radius: 14px; max-width: 750px; width: 92%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); border: 3px solid #007bff;
            display: none; text-align: center; box-sizing: border-box;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -10px); } to { opacity: 1; transform: translate(-50%, 0); } }
        
        #tutorial-title { font-size: calc(1.7rem + 8px); color: #4dabf7; margin-bottom: 12px; font-weight: bold; }
        #tutorial-desc { font-size: calc(1.4rem + 6px); line-height: 1.6; margin-bottom: 18px; }
