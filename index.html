<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧日照中心 - 實境模擬參訪系統</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
        body { margin: 0; font-family: "Microsoft JhengHei", sans-serif; overflow: hidden; background: #000; font-size: calc(1rem + 5px); }
        #panorama { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }

        /* 平面圖片檢視器容器樣式 */
        #flat-view-container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.92); z-index: 20; display: none;
            justify-content: center; align-items: center; flex-direction: column;
            padding: 20px; box-sizing: border-box;
        }
        #flat-view-container img {
            max-width: 80vw; max-height: 55vh; border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); object-fit: contain;
            border: 2px solid rgba(255,255,255,0.2);
            margin-bottom: 15px;
        }
        #flat-detail-panel {
            background: rgba(255, 255, 255, 0.95);
            color: #333; padding: 15px 25px; border-radius: 8px;
            max-width: 75vw; width: 700px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border-left: 5px solid #007bff; box-sizing: border-box; position: relative;
        }
        #flat-detail-panel h3 { margin: 0 0 8px 0; font-size: calc(1.7rem + 10px); color: #007bff; }
        #flat-detail-panel p { margin: 0; font-size: calc(1.6rem + 10px); line-height: 1.5; color: #555; }
        
        #flat-detail-panel.keep-original-size h3 { font-size: 1.7rem; }
        #flat-detail-panel.keep-original-size p { font-size: 1.6rem; }

        .back-to-class-btn {
            background: #dc3545; color: white; border: none; padding: 10px 18px;
            font-size: calc(1.2rem + 5px); border-radius: 6px; cursor: pointer; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4); transition: background 0.2s;
            margin-top: 15px; display: inline-block;
        }
        .back-to-class-btn:hover { background: #c82333; }

        /* 空間介紹區域（右下角） */
        #info-modal {
            position: absolute; bottom: 20px; right: 20px; z-index: 30;
            background: rgba(255, 255, 255, 0.95); color: #333; padding: 15px 20px; border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4); max-width: 390px; width: 390px;
            border-left: 5px solid #007bff; box-sizing: border-box;
            transition: all 0.3s ease;
        }
        #info-modal h3 { margin: 0 0 8px 0; font-size: calc(1.7rem + 10px); color: #007bff; }
        #info-modal p { margin: 0; font-size: calc(1.2rem + 10px); line-height: 1.6; color: #555; }

        #info-modal .close-btn {
            font-size: calc(1.3rem + 10px); padding: 8px 14px; cursor: pointer;
            background: #f8f9fa; border: 1px solid #ccc; border-radius: 6px;
            margin-bottom: 10px; font-weight: bold; color: #333;
        }
        #info-modal .close-btn:hover { background: #e2e6ea; }

        #info-modal.keep-original-size h3 { font-size: 1.7rem; }
        #info-modal.keep-original-size p { font-size: 1.2rem; }

        #info-modal.collapsed {
            padding: 10px 5px; cursor: pointer; background: rgba(0, 123, 255, 0.9);
            border-left: none; bottom: 20px; right: 20px; width: 183px !important;
            max-width: 183px !important; text-align: center;
        }
        #info-modal.collapsed h3,
        #info-modal.collapsed p,
        #info-modal.collapsed .close-btn { display: none; }
        #info-modal.collapsed::after {
            content: "展開空間介紹"; font-size: calc(1.3rem + 10px);
            color: #fff; font-weight: bold; white-space: nowrap;
        }

        /* 回到上一步按鈕樣式 */
        .back-step-btn {
            width: 185px; height: 62px; padding: 12px 18px;
            font-size: calc(1.3rem + 10px); border-radius: 6px; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4); box-sizing: border-box;
            text-align: center; line-height: normal;
            position: absolute; top: 20px; right: 0px; z-index: 25;
            background: #6c757d; color: white; border: none; cursor: pointer;
            transition: background 0.2s, opacity 0.3s ease;
        }
        .back-step-btn:hover { background: #5a6268; }

        /* 快速導覽選單樣式 */
        #quick-nav-container {
            position: absolute; top: 20px; left: 40px; z-index: 25;
            transition: opacity 0.3s ease;
        }
        #quick-nav-select {
            width: 170px; height: 62px; padding: 12px 18px;
            font-size: calc(1.3rem + 10px); border-radius: 6px; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4); box-sizing: border-box;
            text-align: center; line-height: normal;
            background: rgba(0, 123, 255, 0.9); color: white;
            border: 1px solid rgba(255, 255, 255, 0.4); cursor: pointer; outline: none;
        }
        #quick-nav-select option { background: #333; color: white; }

        /* 左下角小地圖樣式 */
        #mini-map-container {
            position: absolute; bottom: 39px; left: 20px; z-index: 25;
            width: 180px; height: 120px; background: rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 8px;
            overflow: hidden; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
        }
        #mini-map-container:hover { border-color: #007bff; transform: scale(1.05); }
        #mini-map-img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        
        .map-zoom-icon {
            position: absolute; top: 8px; right: 8px; z-index: 27;
            background: rgba(0, 0, 0, 0.6); color: white; width: 26px; height: 26px;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: calc(0.9rem + 5px); pointer-events: none; border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .map-marker {
            position: absolute; width: 14px; height: 14px; background: #dc3545;
            border: 2px solid #fff; border-radius: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 6px rgba(0,0,0,0.8); transition: all 0.3s ease;
            z-index: 26; pointer-events: none;
        }

        #map-modal {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85); z-index: 50; display: none;
            justify-content: center; align-items: center; flex-direction: column;
        }
        #map-modal-content {
            position: relative; max-width: 80vw; max-height: 80vh;
            background: #fff; padding: 15px; border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        #map-modal-img { max-width: 75vw; max-height: 70vh; display: block; border-radius: 4px; }
        #map-modal-img-wrapper { position: relative; display: inline-block; }
        .close-map-btn {
            position: absolute; top: -15px; right: -15px; background: #dc3545;
            color: white; border: none; width: 35px; height: 35px; border-radius: 50%;
            font-size: calc(1.2rem + 5px); cursor: pointer; font-weight: bold; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            z-index: 60;
        }

        .pnlm-hotspot-base { transform: scale(4); transform-origin: center center; }
        .pnlm-tooltip span { font-size: calc(1.1rem + 5px) !important; padding: 6px 12px !important; }

        /* ===== 教學提示框往下移 15px (改為 top: 40px) ===== */
        #interactive-tutorial-banner {
            position: absolute; top: 130px; left: 50%; transform: translateX(-50%);
            width: 380px; 
            background: rgba(0, 123, 255, 0.95); color: white; padding: 12px 15px;
            border-radius: 10px; z-index: 100; font-size: calc(1.1rem + 2px); font-weight: bold;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6); text-align: center; border: 2px solid white;
            pointer-events: none; box-sizing: border-box; line-height: 1.4;
        }
        .tutorial-mode-title {
            font-size: calc(1.2rem + 4px);
            color: #ffe066;
            margin-bottom: 4px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        /* 加大加粗的紅色動態箭頭 */
        .big-red-arrow {
            position: absolute; z-index: 95; font-size: 85px; font-weight: 900; color: #ff0000;
            text-shadow: 0 0 15px #ffffff, 0 0 30px #ff0000;
            animation: bounceArrow 1s infinite alternate; pointer-events: none;
        }
        @keyframes bounceArrow {
            0% { transform: translateY(-2px) scale(1); }
            100% { transform: translateY(15px) scale(1.15); }
        }

        /* 半透明滑動教學提示 */
        .swipe-hint-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 90; display: flex; justify-content: space-between; align-items: center;
            padding: 0 50px; box-sizing: border-box; pointer-events: none;
        }
        .swipe-arrow {
            font-size: 80px; color: rgba(255, 255, 255, 0.7);
            background: rgba(0,0,0,0.4); padding: 20px; border-radius: 50%;
            animation: pulseSwipe 1.2s infinite ease-in-out;
        }
        @keyframes pulseSwipe {
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 0.5; }
        }
    </style>
</head>
<body>

    <!-- 互動教學提示橫幅 -->
    <div id="interactive-tutorial-banner">
        <div class="tutorial-mode-title">【教學模式】</div>
        <div id="tutorial-text">載入中...</div>
    </div>

    <!-- 動態大紅箭頭容器 -->
    <div id="dynamic-arrow-container"></div>

    <!-- 快速導覽選單 -->
    <div id="quick-nav-container">
        <select id="quick-nav-select" onchange="quickJump(this.value)">
            <option value="" disabled selected>快速導覽</option>
            <option value="counter">櫃檯</option>
            <option value="shoes">鞋櫃</option>
            <option value="locker">櫃子</option>
            <option value="activity">活動區</option>
            <option value="safe_home">平安家</option>
            <option value="happy">快樂家</option>
            <option value="Perfect">圓滿家</option>
            <option value="Attend class">教室區</option>
            <option value="openKitchen">廚房</option>
            <option value="openEscape">逃生區與洗手台</option>
            <option value="accessible_toilet">無障礙廁所</option>
            <option value="toilet1">性別友善廁所</option>
            <option value="toilet2">性別友善廁所與無障礙廁所</option>
        </select>
    </div>

    <!-- 左下角小地圖 -->
    <div id="mini-map-container" onclick="handleMiniMapClick()" title="點擊放大全圖">
        <div class="map-zoom-icon">🔍</div>
        <img id="mini-map-img" src="1791951164235.jpg" alt="小地圖" onerror="this.src='https://placehold.co/180x120/333/fff?text=Map'">
        <div id="map-marker" class="map-marker"></div>
    </div>

    <!-- 放大版地圖 Modal -->
    <div id="map-modal" onclick="closeLargeMap(event)">
        <div id="map-modal-content" onclick="event.stopPropagation()">
            <button class="close-map-btn" onclick="closeLargeMap()">✖</button>
            <h3 style="margin-top: 0; color: #333; text-align: center; font-size: calc(1.4rem + 5px);">中心平面導覽圖</h3>
            <div id="map-modal-img-wrapper">
                <img id="map-modal-img" src="1791951164235.jpg" alt="大張地圖" onerror="this.src='https://placehold.co/800x600/333/fff?text=Large+Map'">
                <div id="map-modal-marker" class="map-marker"></div>
            </div>
        </div>
    </div>

    <!-- 回到上一步按鈕 -->
    <button class="back-step-btn" onclick="handleBackStepClick()">回到上一步</button>

    <!-- 空間介紹彈跳視窗 -->
    <div id="info-modal" onclick="checkInfoToggle(event)">
        <button class="close-btn" onclick="toggleInfoModal(event)">✖ 關閉介紹</button>
        <h3 id="modal-title">區域名稱</h3>
        <p id="modal-desc">區域介紹內容...</p>
    </div>

    <div id="panorama"></div>

    <!-- 平面照片檢視容器 -->
    <div id="flat-view-container">
        <img id="flat-image" src="廚房.jpg" alt="平面圖" onerror="this.src='https://placehold.co/800x600/333/fff?text=Flat+Image'">

        <div id="flat-detail-panel">
            <h3 id="flat-detail-title">區域名稱</h3>
            <p id="flat-detail-desc">詳細介紹內容...</p>
            <button class="back-to-class-btn" onclick="returnToClass()">返回教室區</button>
        </div>
    </div>

    <script>
        const sceneInfo = {
            "counter": {
                "title": "櫃檯｜長輩接送區",
                "desc": "提供家屬及交通車接送長輩的交接空間，方便長輩每日安全進出中心。"
            },
            "shoes": {
                "title": "鞋櫃區｜培養生活自主性",
                "desc": "讓長輩自己練習穿脫鞋子，維持原有生活習慣，營造像回家一樣的生活感。"
            },
            "locker": {
                "title": "置物櫃｜一人一櫃",
                "desc": "每位長輩都有自己的專屬置物櫃，可放置個人物品，保有自己的小空間。"
            },
            "safe_home": {
                "title": "平安家（日照生活室）",
                "desc": "提供午休與日常休息空間，設有固定座位。"
            },
            "happy": {
                "title": "快樂家（日照生活室）",
                "desc": "兼具休息區與小教室功能，有幾位長輩的專屬座位與活動區域。"
            },
            "accessible_toilet": {
                "title": "無障礙廁所",
                "desc": "適合輪椅、助行器或下肢較無力的長輩使用。設有求救鈴。"
            },
            "toilet1": {
                "title": "性別友善廁所",
                "desc": "設有三個小便斗、三間廁所及衛生紙取用區，外側左方設有洗手台。每間皆設有求救鈴。"
            },
            "toilet2": {
                "title": "性別友善廁所與無障礙廁所",
                "desc": "設有三間廁所及衛生紙取用區，外側左右兩邊皆有洗手台。無障礙廁所適合輪椅、助行器或下肢較無力的長輩使用。每間皆設有求救鈴。"
            },
            "Attend class": {
                "title": "教室區｜活動、運動與用餐",
                "desc": "提供長輩進行運動-手作-唱歌等團體活動，也是午餐及點心的主要使用空間，增加長輩彼此交流的機會。"
            },
            "Perfect": {
                "title": "圓滿家（日照生活室）",
                "desc": "提供午休與休息使用，同樣設有固定座位。"
            },
            "kitchen": {
                "title": "廚房｜依需求準備餐食與安全設計",
                "desc": "負責準備長輩的午餐與點心，並依照長輩的咀嚼能力與飲食需求準備餐食。與教室區保持良好視線，工作人員備餐時也能兼顧長輩安全。",
                "keepOriginal": true
            },
            "escape_wash": {
                "title": "逃生區與洗手台｜安全疏散與衛生便利",
                "desc": "位於教室區右側，設置緊急逃生動線以確保突發狀況時的安全疏散;同時配有洗手台，方便長輩在活動前後或用餐前後就近洗手維持衛生。",
                "keepOriginal": true
            },
            "activity": {
                "title": "活動區｜休息與交流",
                "desc": "設有沙發椅，提供午休及活動空檔休息使用，並有固定座位，讓長輩擁有熟悉的位置。"
            }
        };

        const sceneCoordinates = {
            "counter": { x: 86, y: 90 },
            "shoes": { x: 86, y: 70 },
            "locker": { x: 80, y: 58.5 },
            "safe_home": { x: 65, y: 30 },
            "happy": { x: 47.1, y: 30 },
            "Perfect": { x: 30, y: 30 },
            "Attend class": { x: 30, y: 64 },
            "activity": { x: 83, y: 30 },
            "accessible_toilet": { x: 60, y: 68 },
            "toilet1": { x: 40, y: 85 },
            "toilet2": { x: 57, y: 85 },
            "kitchen": { x: 22, y: 90 },
            "escape_wash": { x: 18, y: 30 }
        };

        const viewer = pannellum.viewer('panorama', {
            "default": {
                "firstScene": "counter",
                "autoLoad": true,
                "compass": false
            },
            "scenes": {
                "counter": {
                    "title": "櫃台", "type": "equirectangular", "panorama": "櫃台.jpg",
                    "hotSpots": [{ "pitch": 0, "yaw": 120, "type": "scene", "text": "前往：鞋櫃", "sceneId": "shoes", "id": "hotspot_arrow_1" }]
                },
                "shoes": {
                    "title": "鞋櫃", "type": "equirectangular", "panorama": "鞋櫃.jpg",
                    "hotSpots": [
                        { "pitch": 0, "yaw": 140, "type": "scene", "text": "返回：櫃台", "sceneId": "counter" },
                        { "pitch": 0, "yaw": -90, "type": "scene", "text": "前往：走道", "sceneId": "aisle" }
                    ]
                },
                "aisle": {
                    "title": "走道", "type": "equirectangular", "panorama": "1.jpg",
                    "hotSpots": []
                },
                "locker": { "title": "置物櫃", "type": "equirectangular", "panorama": "櫃子.jpg", "hotSpots": [] },
                "corridor": { "title": "走廊", "type": "equirectangular", "panorama": "走廊.jpg", "hotSpots": [] },
                "middle": { "title": "走廊2", "type": "equirectangular", "panorama": "中段.jpg", "hotSpots": [] },
                "safe_home": { "title": "平安家", "type": "equirectangular", "panorama": "平安家.jpg", "hotSpots": [] },
                "happy": { "title": "快樂家", "type": "equirectangular", "panorama": "快樂家.jpg", "hotSpots": [] },
                "accessible_toilet": { "title": "無障礙廁所", "type": "equirectangular", "panorama": "廁所4.jpg", "hotSpots": [] },
                "toilet2": { "title": "性別友善廁所與無障礙廁所", "type": "equirectangular", "panorama": "廁所2.jpg", "hotSpots": [] },
                "toilet1": { "title": "性別友善廁所", "type": "equirectangular", "panorama": "廁所1.jpg", "hotSpots": [] },
                "Perfect": { "title": "圓滿家", "type": "equirectangular", "panorama": "圓滿家.jpg", "hotSpots": [] },
                "Attend class": { "title": "上課區", "type": "equirectangular", "panorama": "上課區.jpg", "hotSpots": [] },
                "activity": { "title": "活動區", "type": "equirectangular", "panorama": "活動區.jpg", "hotSpots": [] }
            }
        });

        let navigationHistory = ["counter"];
        let tutorialStep = 1;
        let totalMoved = 0;
        let isDragging = false;
        let startX = 0;

        function initTutorial() {
            setTutorialStep(1);
        }

        function setTutorialStep(step) {
            tutorialStep = step;
            const textElement = document.getElementById('tutorial-text');
            const arrowContainer = document.getElementById('dynamic-arrow-container');
            arrowContainer.innerHTML = ''; // 清除舊箭頭

            if (step === 1) {
                textElement.innerHTML = "<strong>如何查看空間介紹</strong><br>右下角隨時提供當前區域的詳細介紹。請您可以點擊「展開空間介紹」將其展開。";
                // 箭頭精準指著右下角「展開空間介紹」按鈕上方
                arrowContainer.innerHTML = `<div class="big-red-arrow" style="bottom: 75px; right: 90px;">⬇</div>`;
            } 
            else if (step === 2) {
                textElement.innerHTML = "左上角隨時可以關閉空間介紹。 請您點擊「關閉介紹」將其收合。";
                // 箭頭精準指著彈出視窗內的「關閉介紹」按鈕上方
                arrowContainer.innerHTML = `<div class="big-red-arrow" style="bottom: 270px; right: 190px;">⬇</div>`;
            }
            else if (step === 3) {
                textElement.innerHTML = "<strong>如何滑動畫面</strong><br>請按住畫面左右滑動，旋轉一圈觀察環境！";
                const swipeDiv = document.createElement('div');
                swipeDiv.className = 'swipe-hint-overlay';
                swipeDiv.id = 'swipe-overlay-hint';
                swipeDiv.innerHTML = `<div class="swipe-arrow">⬅ 拖曳</div><div class="swipe-arrow">拖曳 ➡</div>`;
                document.body.appendChild(swipeDiv);
            }
            else if (step === 4) {
                textElement.innerHTML = "<strong>如何使用箭頭引導</strong><br>請點擊畫面中的紅色箭頭引導按鈕前往下個地點！";
                arrowContainer.innerHTML = `<div class="big-red-arrow" style="top: 48px; left: 58%;">⬅</div>`;
            }
            else if (step === 5) {
                textElement.innerHTML = "<strong>如何使用快速導覽</strong><br>請點擊左上角的「快速導覽」選單！";
                arrowContainer.innerHTML = `<div class="big-red-arrow" style="top: 88px; left: 218px;">⬆</div>`;
            }
            else if (step === 6) {
                textElement.innerHTML = "<strong>如何使用地圖定位</strong><br>請點擊左下角的小地圖將其放大！";
                arrowContainer.innerHTML = `<div class="big-red-arrow" style="bottom: 158px; left: 208px;">⬇</div>`;
            }
            else if (step === 7) {
                textElement.innerHTML = "<strong>如何回到上一步</strong><br>請點擊右上角的「回到上一步」按鈕！";
                arrowContainer.innerHTML = `<div class="big-red-arrow" style="top: 88px; right: 198px;">⬆</div>`;
            }
            else if (step === 8) {
                textElement.innerHTML = "🎉 教學完成！即將帶您回到初始畫面開始正式參訪...";
                setTimeout(() => {
                    document.getElementById('interactive-tutorial-banner').style.display = 'none';
                    viewer.loadScene("counter");
                }, 2500);
            }
        }

        // 1. 空間介紹點擊監聽
        function toggleInfoModal(event) {
            if (event) event.stopPropagation();
            const modal = document.getElementById('info-modal');
            const wasCollapsed = modal.classList.contains('collapsed');
            
            // 步驟 1 點擊展開時立即清除箭頭並進入步驟 2
            if (tutorialStep === 1 && wasCollapsed) {
                document.getElementById('dynamic-arrow-container').innerHTML = '';
                setTutorialStep(2);
            } 
            else if (tutorialStep === 2 && !wasCollapsed) {
                document.getElementById('dynamic-arrow-container').innerHTML = '';
                setTutorialStep(3);
            }

            modal.classList.toggle('collapsed');
        }

        function checkInfoToggle(event) {
            const modal = document.getElementById('info-modal');
            if (modal.classList.contains('collapsed') && tutorialStep === 1) {
                toggleInfoModal(event);
            }
        }

        // 2. 監聽畫面滑動 (步驟3)
        document.getElementById('panorama').addEventListener('mousedown', (e) => { if (tutorialStep === 3) { isDragging = true; startX = e.clientX; } });
        window.addEventListener('mousemove', (e) => {
            if (isDragging && tutorialStep === 3) {
                totalMoved += Math.abs(e.clientX - startX);
                startX = e.clientX;
                if (totalMoved > 400) {
                    isDragging = false;
                    const hint = document.getElementById('swipe-overlay-hint');
                    if (hint) hint.remove();
                    setTutorialStep(4);
                }
            }
        });
        window.addEventListener('mouseup', () => { isDragging = false; });

        document.getElementById('panorama').addEventListener('touchstart', (e) => { if (tutorialStep === 3) { isDragging = true; startX = e.touches[0].clientX; } });
        window.addEventListener('touchmove', (e) => {
            if (isDragging && tutorialStep === 3) {
                totalMoved += Math.abs(e.touches[0].clientX - startX);
                startX = e.touches[0].clientX;
                if (totalMoved > 400) {
                    isDragging = false;
                    const hint = document.getElementById('swipe-overlay-hint');
                    if (hint) hint.remove();
                    setTutorialStep(4);
                }
            }
        });

        // 3. 箭頭引導按鈕點擊監聽 (步驟4)
        viewer.on('scenechange', function(sceneId) {
            updateMapMarker(sceneId);
            if (navigationHistory[navigationHistory.length - 1] !== sceneId) {
                navigationHistory.push(sceneId);
            }

            if (tutorialStep === 4 && sceneId === "shoes") {
                setTutorialStep(5);
            }

            const info = sceneInfo[sceneId];
            if (info) {
                document.getElementById('modal-title').innerText = info.title;
                document.getElementById('modal-desc').innerText = info.desc;
            }
        });

        // 4. 快速導覽選單監聽 (步驟5)
        function quickJump(value) {
            if (!value) return;
            if (tutorialStep === 5) {
                setTutorialStep(6);
            }
            viewer.loadScene(value);
            document.getElementById('quick-nav-select').selectedIndex = 0;
        }

        // 5. 地圖點擊與放大監聽 (步驟6)
        function handleMiniMapClick() {
            if (tutorialStep === 6) {
                openLargeMap();
                setTutorialStep(7);
            } else {
                openLargeMap();
            }
        }

        function openLargeMap() {
            document.getElementById('map-modal').style.display = 'flex';
        }

        function closeLargeMap(event) {
            if (!event || event.target.id === 'map-modal' || event.target.classList.contains('close-map-btn')) {
                document.getElementById('map-modal').style.display = 'none';
            }
        }

        // 6. 返回上一步監聽 (最後步驟)
        function handleBackStepClick() {
            if (tutorialStep === 7) {
                setTutorialStep(8);
            } else {
                goBackStep();
            }
        }

        function goBackStep() {
            if (navigationHistory.length > 1) {
                navigationHistory.pop();
                const prevScene = navigationHistory[navigationHistory.length - 1];
                viewer.loadScene(prevScene);
            } else {
                alert("已經是起點囉！");
            }
        }

        function updateMapMarker(sceneId) {
            const pos = sceneCoordinates[sceneId];
            const miniMarker = document.getElementById('map-marker');
            const largeMarker = document.getElementById('map-modal-marker');
            
            if (pos) {
                miniMarker.style.left = pos.x + '%';
                miniMarker.style.top = pos.y + '%';
                miniMarker.style.display = 'block';
                largeMarker.style.left = pos.x + '%';
                largeMarker.style.top = pos.y + '%';
                largeMarker.style.display = 'block';
            }
        }

        window.onload = function() {
            showInfo("counter");
            updateMapMarker("counter");
            document.getElementById('info-modal').classList.add('collapsed');
            initTutorial();
        };

        function showInfo(sceneId) {
            const info = sceneInfo[sceneId];
            if (info) {
                document.getElementById('modal-title').innerText = info.title;
                document.getElementById('modal-desc').innerText = info.desc;
            }
        }
    </script>

</body>
</html>
